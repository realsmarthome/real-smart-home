<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประเมินราคา DIY - Real Smart Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent: #00d2ff;
            --text-light: #ffffff;
            --paper-bg: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Prompt', sans-serif; background: var(--bg-dark); color: var(--text-light); }

        /* Header Bar */
        .top-nav {
            background: #111; padding: 15px 30px; display: flex;
            justify-content: space-between; align-items: center; border-bottom: 1px solid #222;
        }
        .top-nav a { color: #888; text-decoration: none; font-size: 0.9rem; }
        .top-nav h2 { font-size: 1.1rem; color: var(--accent); }

        .main-wrapper { display: flex; gap: 0; min-height: calc(100vh - 60px); }

        /* Left Side: Product Selection */
        .product-section { flex: 1.5; padding: 30px; border-right: 1px solid #222; }
        
        /* Filter Bar */
        .filter-bar { display: flex; gap: 10px; margin-bottom: 25px; overflow-x: auto; padding-bottom: 10px; }
        .filter-btn {
            background: #222; border: 1px solid #333; color: #fff; padding: 6px 15px;
            border-radius: 5px; cursor: pointer; white-space: nowrap; font-size: 0.85rem;
        }
        .filter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }

        .product-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px;
        }
        .p-card {
            background: var(--card-bg); border-radius: 10px; padding: 15px;
            border: 1px solid #222; display: flex; flex-direction: column; justify-content: space-between;
        }
        .p-name { font-size: 0.95rem; font-weight: 500; margin-bottom: 5px; }
        .p-price { color: var(--accent); font-weight: 600; margin-bottom: 15px; font-size: 1.1rem; }
        
        .qty-controls { display: flex; align-items: center; background: #222; border-radius: 5px; overflow: hidden; }
        .qty-btn { 
            flex: 1; border: none; background: #333; color: #fff; padding: 8px; cursor: pointer; 
            transition: 0.2s; font-size: 1.1rem;
        }
        .qty-btn:hover { background: #444; }
        .qty-num { flex: 2; text-align: center; font-weight: 600; font-size: 1.1rem; }

        .info-btn { 
            font-size: 0.75rem; color: #666; cursor: pointer; margin-bottom: 10px; text-decoration: underline;
        }

        /* Right Side: Paper Preview */
        .preview-section { flex: 1; padding: 30px; position: sticky; top: 0; height: 100vh; overflow-y: auto; background: #151515; }
        .paper {
            background: var(--paper-bg); color: #333; border-radius: 5px; padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); min-height: 800px;
        }
        .paper-header { text-align: center; margin-bottom: 30px; }
        .paper-header h3 { margin-bottom: 5px; }
        .paper-header p { font-size: 0.8rem; color: #777; margin: 2px 0; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; }
        .input-group input, .input-group textarea {
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-family: 'Prompt';
        }

        .items-list { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9rem; }
        .items-list th { border-bottom: 2px solid #eee; padding: 10px 5px; text-align: left; }
        .items-list td { padding: 10px 5px; border-bottom: 1px solid #f5f5f5; }
        
        .btn-save {
            width: 100%; background: var(--accent); color: #000; border: none; padding: 15px;
            border-radius: 5px; font-weight: 700; margin-top: 20px; cursor: pointer; font-size: 1rem;
        }

        /* Detail Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: var(--card-bg); width: 100%; max-width: 500px;
            border-radius: 15px; border: 1px solid #333; overflow: hidden;
        }
        .modal-body { padding: 25px; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; cursor: pointer; font-size: 1.5rem; color: #888; }
        .modal-img { width: 100%; height: 200px; object-fit: contain; background: #000; margin-bottom: 15px; border-radius: 10px; }

        @media (max-width: 1024px) {
            .main-wrapper { flex-direction: column; }
            .preview-section { height: auto; position: static; }
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="index.html"><i class="fa-solid fa-arrow-left"></i> กลับหน้าหลัก</a>
        <h2>ประเมินราคาระบบ (DIY)</h2>
        <div style="width: 80px;"></div>
    </div>

    <div class="main-wrapper">
        <div class="product-section">
            <div class="filter-bar" id="filterBar">
                <button class="filter-btn active" onclick="filterData('all', this)">ทั้งหมด</button>
                <button class="filter-btn" onclick="filterData('sensor', this)">เซ็นเซอร์</button>
                <button class="filter-btn" onclick="filterData('switch', this)">สวิตช์ไฟ</button>
                <button class="filter-btn" onclick="filterData('socket', this)">เต้ารับ</button>
                <button class="filter-btn" onclick="filterData('door', this)">ประตู</button>
                <button class="filter-btn" onclick="filterData('camera', this)">กล้อง</button>
                <button class="filter-btn" onclick="filterData('gateway', this)">เกตเวย์/เสริม</button>
            </div>

            <p style="margin-bottom: 15px; color: #888;">เลือกรายการอุปกรณ์ที่ต้องการ:</p>
            <div class="product-grid" id="productGrid"></div>
        </div>

        <div class="preview-section">
            <div class="paper">
                <div class="paper-header">
                    <h3>Real Smart Home</h3>
                    <p>โทร: 083 0909 036 | Line: @realsmarthome</p>
                    <p>ใบเสนอราคา (เบื้องต้น)</p>
                </div>

                <div class="input-group">
                    <label>ชื่อผู้ติดต่อ *</label>
                    <input type="text" id="cusName" placeholder="กรุณาระบุชื่อของคุณ">
                </div>
                <div class="input-group">
                    <label>เบอร์โทรศัพท์ *</label>
                    <input type="tel" id="cusPhone" placeholder="เช่น 081-234-5678">
                </div>

                <table class="items-list">
                    <thead>
                        <tr>
                            <th style="width: 60%;">รายการ</th>
                            <th style="width: 20%; text-align: center;">จำนวน</th>
                            <th style="width: 20%; text-align: right;">รวม</th>
                        </tr>
                    </thead>
                    <tbody id="cartTable">
                        </tbody>
                </table>

                <div id="emptyCartMsg" style="text-align:center; padding: 40px; color: #ccc;">เลือกอุปกรณ์ทางซ้าย</div>

                <div style="margin-top: 30px; border-top: 2px solid #333; padding-top: 15px; display: flex; justify-content: space-between; font-weight: 700; font-size: 1.1rem;">
                    <span>ยอดรวมสุทธิ:</span>
                    <span id="totalPrice">0 ฿</span>
                </div>

                <div class="input-group" style="margin-top: 25px;">
                    <label>ความต้องการเพิ่มเติม:</label>
                    <textarea id="userNote" rows="3" placeholder="เช่น ขอติดตั้งวันเสาร์..."></textarea>
                </div>

                <button class="btn-save" onclick="saveToDatabase()">บันทึกและส่งข้อมูลให้เจ้าหน้าที่</button>
                <p style="font-size: 0.7rem; color: #999; text-align: center; margin-top: 10px;">* ราคานี้ยังไม่รวมค่าบริการติดตั้ง</p>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="detailModal" onclick="closeDetail(event)">
        <div class="modal-content">
            <div class="modal-body">
                <span class="close-btn" onclick="closeDetailBtn()">&times;</span>
                <img src="" id="modalImg" class="modal-img">
                <h3 id="modalName" style="color: var(--accent); margin-bottom: 10px;"></h3>
                <p id="modalDesc" style="color: #ccc; font-size: 0.9rem; line-height: 1.6;"></p>
                <div id="modalPrice" style="font-size: 1.2rem; font-weight: bold; margin-top: 15px; color: #fff;"></div>
            </div>
        </div>
    </div>

    <script>

    { id: 5, name: "Water Leak Sensor", desc: "เซ็นเซอร์ตรวจจับน้ำรั่ว", price: 550, category: "sensor" },

    // --- หมวดหมู่: เต้ารับ (3 รายการ) ---
    { id: 8, name: "Smart Wall Socket 2 Gang", desc: "เต้ารับไฟอัจฉริยะแบบฝังผนัง 2 ช่อง", price: 750, category: "socket" },
    { id: 12, name: "Smart Wall Socket 2 Gang (PM)", desc: "เต้ารับอัจฉริยะ 2 ช่อง (วัดการใช้ไฟฟ้าได้)", price: 940, category: "socket" },
    { id: 14, name: "Smart Plug 1 Gang", desc: "เต้ารับไฟอัจฉริยะแบบไม่ฝังผนัง 1 ช่อง", price: 350, category: "socket" },

    // --- หมวดหมู่: ประตู (3 รายการ) ---
    { id: 21, name: "Digital Door Lock (Swing) - Hafele", desc: "กลอนประตูดิจิทัล (บานสวิง) Hafele", price: 13900, category: "door" },
    { id: 22, name: "Digital Door Lock (Sliding Door)", desc: "กลอนประตูดิจิทัล (สำหรับบานเลื่อน)", price: 4500, category: "door" },
    { id: 25, name: "Digital Door Lock (Swing Door)", desc: "กลอนประตูดิจิทัล (บานสวิง)", price: 4500, category: "door" },

    // --- หมวดหมู่: สวิตช์ไฟ (15 รายการ) ---
    { id: 32, name: "Smart Switch 1 Gang (Zigbee)", desc: "สวิตช์ไฟอัจฉริยะ 1 ช่อง", price: 690, category: "switch" },
    { id: 33, name: "Smart Switch 2 Gang (Zigbee)", desc: "สวิตช์ไฟอัจฉริยะ 2 ช่อง", price: 740, category: "switch" },
    { id: 34, name: "Smart Switch 3 Gang (Zigbee)", desc: "สวิตช์ไฟอัจฉริยะ 3 ช่อง", price: 790, category: "switch" },
    { id: 35, name: "Smart Switch 2 Gang (EU Type)", desc: "สวิตช์ไฟอัจฉริยะ 2 ช่อง (ทรงยุโรป)", price: 840, category: "switch" },
    { id: 36, name: "Smart Switch 3 Gang (EU Type)", desc: "สวิตช์ไฟอัจฉริยะ 3 ช่อง (ทรงยุโรป)", price: 890, category: "switch" },
    { id: 37, name: "Smart Switch 1 Gang (EU Type)", desc: "สวิตช์ไฟอัจฉริยะ 1 ช่อง (ทรงยุโรป)", price: 790, category: "switch" },
    { id: 38, name: "Dimmer Smart Switch 1 Gang", desc: "สวิตช์หรี่ไฟอัจฉริยะ 1 ช่อง", price: 690, category: "switch" },
    { id: 39, name: "Dimmer Smart Switch 2 Gang", desc: "สวิตช์หรี่ไฟอัจฉริยะ 2 ช่อง", price: 740, category: "switch" },
    { id: 40, name: "Dimmer Smart Switch 3 Gang", desc: "สวิตช์หรี่ไฟอัจฉริยะ 3 ช่อง", price: 790, category: "switch" },
    { id: 41, name: "Push Button Smart Switch 2 Gang", desc: "สวิตช์ปุ่มกดอัจฉริยะ 2 ช่อง", price: 870, category: "switch" },
    { id: 42, name: "Push Button Smart Switch 3 Gang", desc: "สวิตช์ปุ่มกดอัจฉริยะ 3 ช่อง", price: 920, category: "switch" },
    { id: 43, name: "Push Button Smart Switch 1 Gang", desc: "สวิตช์ปุ่มกดอัจฉริยะ 1 ช่อง", price: 740, category: "switch" },
    { id: 44, name: "Push Button Smart Switch 3 Gang (EU)", desc: "สวิตช์ปุ่มกด 3 ช่อง (ทรงยุโรป)", price: 940, category: "switch" },
    { id: 45, name: "Push Button Smart Switch 1 Gang (EU)", desc: "สวิตช์ปุ่มกด 1 ช่อง (ทรงยุโรป)", price: 840, category: "switch" },
    { id: 46, name: "Push Button Smart Switch 2 Gang (EU)", desc: "สวิตช์ปุ่มกด 2 ช่อง (ทรงยุโรป)", price: 890, category: "switch" },

    // --- หมวดหมู่: กล้องวงจรปิด (4 รายการ) ---
    { id: 47, name: "Smart Indoor Security Camera", desc: "กล้องวงจรปิดอัจฉริยะไร้สายภายใน", price: 1390, category: "camera" },
    { id: 48, name: "Smart Outdoor Security Camera", desc: "กล้องวงจรปิดอัจฉริยะไร้สายภายนอก", price: 1590, category: "camera" },
    { id: 49, name: "Smart Outdoor Camera (Bullet)", desc: "กล้องวงจรปิดภายนอกทรง Bullet", price: 1190, category: "camera" },
    { id: 50, name: "Smart Security Camera (Dome)", desc: "กล้องวงจรปิดอัจฉริยะไร้สายทรง Dome", price: 1790, category: "camera" },

    // --- หมวดหมู่: อื่นๆ (10 รายการ) ---
    { id: 51, name: "Google Home Smart Speaker", desc: "ลำโพงสั่งงานด้วยเสียง Google", price: 2900, category: "speaker" },
    { id: 52, name: "Amazon Echo Dot 5th Gen", desc: "ลำโพงสั่งงานด้วยเสียง Alexa", price: 2290, category: "speaker" },
    { id: 53, name: "10.1-inch Smart Display (Alexa)", desc: "หน้าจอควบคุมระบบ ขนาด 10.1 นิ้ว", price: 14300, category: "display" },
    { id: 54, name: "4-inch Smart Display (Alexa)", desc: "หน้าจอควบคุมระบบ ขนาด 4 นิ้ว", price: 4900, category: "display" },
    { id: 55, name: "Zigbee Repeater", desc: "อุปกรณ์ขยายสัญญาณ Zigbee", price: 550, category: "repeater" },
    { id: 56, name: "Zigbee Repeater (Ext. Antenna)", desc: "อุปกรณ์ขยายสัญญาณ พร้อมเสาสัญญาณ", price: 580, category: "repeater" },
    { id: 57, name: "Mini Smart Gateway (Zigbee)", desc: "อุปกรณ์ศูนย์กลางควบคุม (Mini)", price: 890, category: "gateway" },
    { id: 58, name: "Smart IR Remote", desc: "อุปกรณ์ควบคุมเครื่องใช้ไฟฟ้าผ่าน IR", price: 550, category: "ir" },
    { id: 59, name: "Pro Smart Gateway (Zigbee)", desc: "อุปกรณ์ศูนย์กลางควบคุม (Pro)", price: 1850, category: "gateway" },
    { id: 60, name: "Standard Smart Gateway (Zigbee)", desc: "อุปกรณ์ศูนย์กลางควบคุม (Standard)", price: 1290, category: "gateway" }
        ];

        let cart = {};

        function renderGrid(filter = 'all') {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);

            filtered.forEach(p => {
                const qty = cart[p.id] || 0;
                const card = document.createElement('div');
                card.className = 'p-card';
                card.innerHTML = `
                    <div>
                        <div class="info-btn" onclick="openDetail(${p.id})">คลิกดูรายละเอียด</div>
                        <div class="p-name">${p.name}</div>
                        <div class="p-price">฿${p.price.toLocaleString()}</div>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="updateQty(${p.id}, -1)">-</button>
                        <div class="qty-num">${qty}</div>
                        <button class="qty-btn" onclick="updateQty(${p.id}, 1)">+</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateQty(id, delta) {
            cart[id] = (cart[id] || 0) + delta;
            if (cart[id] < 0) cart[id] = 0;
            renderGrid(document.querySelector('.filter-btn.active').getAttribute('onclick').split("'")[1]);
            renderCart();
        }

        function renderCart() {
            const table = document.getElementById('cartTable');
            const emptyMsg = document.getElementById('emptyCartMsg');
            const totalText = document.getElementById('totalPrice');
            table.innerHTML = '';
            
            let total = 0;
            let hasItem = false;

            products.forEach(p => {
                const qty = cart[p.id] || 0;
                if (qty > 0) {
                    hasItem = true;
                    const linePrice = p.price * qty;
                    total += linePrice;
                    table.innerHTML += `
                        <tr>
                            <td>${p.name}</td>
                            <td style="text-align:center;">${qty}</td>
                            <td style="text-align:right;">${linePrice.toLocaleString()}</td>
                        </tr>
                    `;
                }
            });

            emptyMsg.style.display = hasItem ? 'none' : 'block';
            totalText.innerText = total.toLocaleString() + ' ฿';
        }

        function filterData(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGrid(cat);
        }

        // Modal Functions
        function openDetail(id) {
            const p = products.find(prod => prod.id === id);
            document.getElementById('modalName').innerText = p.name;
            document.getElementById('modalDesc').innerText = p.desc;
            document.getElementById('modalPrice').innerText = "ราคา: ฿" + p.price.toLocaleString();
            document.getElementById('modalImg').src = "https://placehold.co/400x300/1a1a1a/00d2ff?text=" + p.name;
            document.getElementById('detailModal').style.display = 'flex';
        }
        function closeDetail(e) { if(e.target.id === 'detailModal') closeDetailBtn(); }
        function closeDetailBtn() { document.getElementById('detailModal').style.display = 'none'; }

        function saveToDatabase() {
            // โค้ด fetch scriptURL เดิมของคุณ (ใส่ข้อมูล Token และตรวจสอบชื่อ/เบอร์โทร)
            alert('ระบบกำลังบันทึกข้อมูลและแจ้งเตือนเจ้าหน้าที่...');
        }

        renderGrid();
    </script>
</body>
</html>
