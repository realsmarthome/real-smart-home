<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประเมินราคา - Real Smart Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent: #00d2ff;
            --text: #ffffff;
            --text-dim: #888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Prompt', sans-serif; background: var(--bg-dark); color: var(--text); }

        nav { padding: 20px; text-align: center; border-bottom: 1px solid #222; background: rgba(15,15,15,0.9); position: sticky; top: 0; z-index: 1000; }
        nav a { color: #fff; text-decoration: none; margin: 0 15px; font-weight: 500; }
        nav a.active { color: var(--accent); }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

        /* Filter Section */
        .filter-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 20px;
            margin-bottom: 30px;
            scrollbar-width: none;
        }
        .filter-btn {
            background: #222;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.3s;
        }
        .filter-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: 600;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: var(--card-bg);
            border-radius: 15px;
            border: 1px solid #222;
            padding: 20px;
            transition: 0.3s;
            position: relative;
        }
        .product-card:hover { border-color: var(--accent); transform: translateY(-5px); }
        
        .category-badge {
            background: rgba(0, 210, 255, 0.1);
            color: var(--accent);
            font-size: 0.75rem;
            padding: 2px 10px;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 10px;
        }

        .product-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 10px; }
        .product-price { color: var(--accent); font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; }
        
        .card-actions { display: flex; gap: 10px; }
        .btn-add { flex: 2; background: var(--accent); color: #000; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-info { flex: 1; background: #333; color: #fff; border: none; padding: 10px; border-radius: 8px; cursor: pointer; }

        /* Modal Popup */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px;
            backdrop-filter: blur(8px);
        }
        .modal-content {
            background: var(--card-bg); width: 100%; max-width: 600px;
            border-radius: 20px; overflow: hidden; border: 1px solid #333;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-img-container { width: 100%; height: 250px; background: #000; display: flex; align-items: center; justify-content: center; }
        .modal-img-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .modal-body { padding: 30px; }
        .close-modal { float: right; cursor: pointer; font-size: 1.5rem; color: #888; }

        /* Cart Sidebar (Brief) */
        .cart-summary {
            position: fixed; bottom: 20px; right: 20px;
            background: var(--accent); color: #000; padding: 15px 30px;
            border-radius: 50px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            cursor: pointer; font-weight: 700; z-index: 999;
        }

    </style>
</head>
<body>

    <nav>
        <a href="index.html">หน้าหลัก</a>
        <a href="oursolution.html">โซลูชัน</a>
        <a href="quotation.html" class="active">ประเมินราคา</a>
    </nav>

    <div class="container">
        <h1 style="margin-bottom: 10px; color: var(--accent);">ประเมินราคาชุดอุปกรณ์</h1>
        <p style="color: #888; margin-bottom: 30px;">เลือกอุปกรณ์ที่ต้องการเพื่อคำนวณราคาเบื้องต้นสำหรับบ้านของคุณ</p>

        <div class="filter-container" id="filterBar">
            <button class="filter-btn active" onclick="filterProducts('all')">ทั้งหมด</button>
            <button class="filter-btn" onclick="filterProducts('sensor')">เซ็นเซอร์</button>
            <button class="filter-btn" onclick="filterProducts('switch')">สวิตช์ไฟ</button>
            <button class="filter-btn" onclick="filterProducts('socket')">เต้ารับ</button>
            <button class="filter-btn" onclick="filterProducts('door')">กลอนประตู</button>
            <button class="filter-btn" onclick="filterProducts('camera')">กล้องวงจรปิด</button>
            <button class="filter-btn" onclick="filterProducts('gateway')">เกตเวย์/เสริม</button>
        </div>

        <div class="product-grid" id="productGrid"></div>
    </div>

    <div class="modal-overlay" id="productModal" onclick="closeModal(event)">
        <div class="modal-content">
            <div class="modal-img-container">
                <img id="modalImg" src="" alt="Product Image">
            </div>
            <div class="modal-body">
                <span class="close-modal" onclick="closeModalBtn()">&times;</span>
                <span class="category-badge" id="modalCat">Category</span>
                <h2 id="modalName" style="margin-bottom: 15px;">Product Name</h2>
                <p id="modalDesc" style="color: #aaa; margin-bottom: 20px; line-height: 1.6;">Description</p>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div class="product-price" id="modalPrice" style="margin-bottom: 0;">0 ฿</div>
                    <button class="btn-add" id="modalAddBtn" style="flex: none; padding: 10px 40px;">เพิ่มลงรายการ</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Presence Sensor (Zigbee)", desc: "เซ็นเซอร์ตรวจจับการมีอยู่ (แม่นยำสูงแม้คนนิ่ง)", price: 1150, category: "sensor", img: "images/products/presence.jpg" },
            { id: 2, name: "Door/Window Sensor", desc: "เซ็นเซอร์ตรวจจับการ เปิด-ปิด ประตู/หน้าต่าง แจ้งเตือนทันที", price: 340, category: "sensor", img: "images/products/door-sensor.jpg" },
            { id: 3, name: "Motion Sensor", desc: "เซ็นเซอร์ตรวจจับการเคลื่อนไหว สำหรับเปิดไฟอัตโนมัติ", price: 340, category: "sensor", img: "images/products/motion.jpg" },
            { id: 32, name: "Smart Switch 1 Gang", desc: "สวิตช์ไฟอัจฉริยะ 1 ช่อง ควบคุมผ่านแอปและเสียง", price: 690, category: "switch", img: "images/products/switch.jpg" },
            { id: 33, name: "Smart Switch 2 Gang", desc: "สวิตช์ไฟอัจฉริยะ 2 ช่อง ควบคุมผ่านแอปและเสียง", price: 740, category: "switch", img: "images/products/switch.jpg" },
            { id: 34, name: "Smart Switch 3 Gang", desc: "สวิตช์ไฟอัจฉริยะ 3 ช่อง ควบคุมผ่านแอปและเสียง", price: 790, category: "switch", img: "images/products/switch.jpg" },
            { id: 21, name: "Digital Lock (Swing) - Hafele", desc: "กลอนประตูดิจิทัลพรีเมียม ปลดล็อกได้หลายระบบ", price: 13900, category: "door", img: "images/products/door-lock.jpg" },
            { id: 47, name: "Indoor Security Camera", desc: "กล้องวงจรปิดภายในบ้าน คมชัด 2K หมุนได้ 360 องศา", price: 1390, category: "camera", img: "images/products/indoor-cam.jpg" },
            { id: 59, name: "Pro Smart Gateway", desc: "อุปกรณ์ศูนย์กลางเชื่อมต่อทุกอุปกรณ์ในบ้านเข้าด้วยกัน", price: 1850, category: "gateway", img: "images/products/gateway.jpg" }
            // ... (ใส่ต่อจนครบ 42 รายการตามข้อมูลที่คุณมี) ...
        ];

        let cart = {};

        function renderGrid(filter = 'all') {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <span class="category-badge">${getCatThai(p.category)}</span>
                    <div class="product-name">${p.name}</div>
                    <div class="product-price">${p.price.toLocaleString()} ฿</div>
                    <div class="card-actions">
                        <button class="btn-add" onclick="addToCart(${p.id})">เพิ่มชุดอุปกรณ์</button>
                        <button class="btn-info" onclick="openProductDetail(${p.id})"><i class="fa-solid fa-circle-info"></i></button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function getCatThai(cat) {
            const map = { 'sensor': 'เซ็นเซอร์', 'switch': 'สวิตช์ไฟ', 'socket': 'เต้ารับ', 'door': 'ประตู/ล็อค', 'camera': 'กล้อง', 'gateway': 'เกตเวย์' };
            return map[cat] || 'อื่นๆ';
        }

        function filterProducts(cat) {
            // Update buttons
            const btns = document.querySelectorAll('.filter-btn');
            btns.forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            renderGrid(cat);
        }

        // Modal Logic
        const modal = document.getElementById('productModal');
        function openProductDetail(id) {
            const p = products.find(prod => prod.id === id);
            if(!p) return;

            document.getElementById('modalName').innerText = p.name;
            document.getElementById('modalDesc').innerText = p.desc;
            document.getElementById('modalCat').innerText = getCatThai(p.category);
            document.getElementById('modalPrice').innerText = p.price.toLocaleString() + " ฿";
            document.getElementById('modalImg').src = p.img || "https://placehold.co/600x400/1a1a1a/00d2ff?text=Smart+Device";
            document.getElementById('modalAddBtn').onclick = () => { addToCart(p.id); closeModalBtn(); };

            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal(e) { if(e.target.id === 'productModal') closeModalBtn(); }
        function closeModalBtn() { 
            modal.style.display = 'none'; 
            document.body.style.overflow = 'auto';
        }

        function addToCart(id) {
            cart[id] = (cart[id] || 0) + 1;
            alert('เพิ่มอุปกรณ์ลงในรายการประเมินแล้วครับ');
        }

        // Initial Load
        renderGrid();

    </script>
</body>
</html>
