<html lang="th">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent: #00d2ff;
            --text: #ffffff;
            --text-dim: #888;
            --overlay: rgba(0, 0, 0, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Prompt', sans-serif; background: var(--bg-dark); color: var(--text); overflow-x: hidden; }

        /* Navigation */
        nav { padding: 20px; text-align: center; border-bottom: 1px solid #222; background: rgba(15,15,15,0.9); position: sticky; top: 0; z-index: 1000; }
        nav a { color: #fff; text-decoration: none; margin: 0 15px; font-weight: 500; transition: 0.3s; }
        nav a:hover, nav a.active { color: var(--accent); }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; position: relative; }

        .header-section { text-align: center; margin-bottom: 50px; }
        .header-section h1 { font-size: 2.5rem; color: var(--accent); margin-bottom: 10px; }

        /* Day/Night & Away Toggles */
        .controls { display: flex; gap: 15px; margin-bottom: 20px; justify-content: center; }
        .toggle-btn {
            background: #222; border: 1px solid #444; color: #fff; padding: 10px 20px;
            border-radius: 50px; cursor: pointer; transition: 0.3s; font-family: 'Prompt'; display: flex; align-items: center; gap: 8px;
        }
        .toggle-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }

        /* Interactive Blueprint Area */
        .showcase-wrapper {
            position: relative;
            background: #151515;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #222;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* House Visual Simulation (Using Provided Image) */
        .house-blueprint {
            position: relative;
            width: 100%;
            height: auto;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #333;
            transition: 0.5s;
        }
        .house-blueprint img { width: 100%; height: auto; display: block; transition: filter 0.5s; }

        /* Night Mode Effects for House Image */
        .night-mode .house-blueprint img { filter: brightness(0.3) contrast(1.1); }
        .night-mode .house-blueprint::after {
            content: '';
            position: absolute;
            top: 61%; /* RGB TV */
            left: 23%;
            width: 25%;
            height: 15%;
            background: rgba(0, 210, 255, 0.1); /* Movie Scene Color */
            box-shadow: 0 0 50px 20px rgba(0, 210, 255, 0.1);
            border-radius: 10px;
            pointer-events: none;
            transition: 0.5s;
        }

        /* Hotspots (Pulsing Circles) */
        .hotspot {
            position: absolute;
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            animation: pulse 2s infinite;
            z-index: 10;
            transition: 0.3s;
            color: var(--accent);
            font-size: 0.9rem;
        }
        .hotspot:hover { transform: scale(1.3); background: #fff; color: #000; box-shadow: 0 0 15px #fff; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0px rgba(0, 210, 255, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(0, 210, 255, 0); }
            100% { box-shadow: 0 0 0 0px rgba(0, 210, 255, 0); }
        }

        /* Modal (Popup) */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9);
            display: none; align-items: center; justify-content: center; padding: 20px;
            z-index: 2000; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: var(--card-bg); width: 100%; max-width: 600px;
            border-radius: 15px; overflow: hidden; border: 1px solid #333;
            position: relative; animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-header {
            padding: 20px; border-bottom: 1px solid #333; text-align: center;
            display: flex; align-items: center; justify-content: space-between;
        }
        .modal-title { font-size: 1.3rem; font-weight: 600; color: var(--accent); }
        .close-modal { font-size: 1.5rem; color: #888; cursor: pointer; transition: 0.3s; }
        .close-modal:hover { color: #fff; }

        .modal-body { padding: 30px; display: flex; flex-direction: column; gap: 20px; }
        
        /* Modal Visual Simulation (Simplified Graphic inside Modal) */
        .modal-visual-sim {
            width: 100%; height: 200px; background: #111; border-radius: 10px;
            border: 1px solid #333; overflow: hidden; position: relative;
            display: flex; align-items: center; justify-content: center;
        }

        /* 1. Curtain Sim */
        .curtain-sim { width: 100%; height: 100%; position: relative; }
        .curtain-panel { position: absolute; top: 0; bottom: 0; width: 50%; background: #555; transition: width 0.5s; border: 1px solid #333; }
        .curtain-panel.left { left: 0; border-radius: 5px 0 0 5px; }
        .curtain-panel.right { right: 0; border-radius: 0 5px 5px 0; }
        .closed .curtain-panel.left { width: 0; }
        .closed .curtain-panel.right { width: 0; }
        .closed-middle-line { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #111; transform: translateX(-50%); display: none; }
        .closed .closed-middle-line { display: block; }

        /* 2. RGB Sim */
        .rgb-sim { width: 100%; height: 100%; background: black; display: flex; align-items: center; justify-content: center; position: relative;}
        .tv-screen-sim { width: 60%; height: 60%; background: #000; border: 2px solid #222; border-radius: 5px; box-shadow: 0 0 20px rgba(0, 0, 0, 0); transition: 0.5s; }
        .rgb-sim::after { content: ''; position: absolute; inset: 0; border-radius: 10px; background: rgba(0,0,0,0.5); pointer-events: none;} /* Simulates ambient light */
        .movie .tv-screen-sim { box-shadow: 0 0 30px rgba(0, 210, 255, 0.7); }
        .relax .tv-screen-sim { box-shadow: 0 0 30px rgba(255, 100, 0, 0.7); }
        .working .tv-screen-sim { box-shadow: 0 0 30px rgba(255, 255, 255, 0.7); }

        .modal-desc { color: var(--text-dim); line-height: 1.6; font-size: 0.95rem; text-align: center; }

        /* Modal Interaction Controls */
        .modal-sim-controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
        .sim-btn {
            background: #222; border: 1px solid #444; color: #fff; padding: 8px 15px;
            border-radius: 5px; cursor: pointer; transition: 0.3s; font-family: 'Prompt'; font-size: 0.8rem;
        }
        .sim-btn:hover { background: #333; border-color: var(--accent); }
        .sim-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }

    </style>
</head>

            const sim = document.getElementById('curtainSim');

                sim.classList.remove('closed'); // Start closing animation (via CSS transitions from full width to narrow full width in central position)

                        <div class="curtain-panel right"></div>

            const body = document.body;
            
            if(mode === 'night') {
                body.classList.add('night-mode');
                document.getElementById('nightBtn').classList.add('active');
                document.getElementById('dayBtn').classList.remove('active');
            } else {
                body.classList.remove('night-mode');
                document.getElementById('dayBtn').classList.add('active');
                document.getElementById('nightBtn').classList.remove('active');
            }
        }

        function openModal(id) {
            const data = solutionsData[id];
            if (!data) return;
        
            modalTitle.innerText = data.title;
            modalDesc.innerText = data.desc;
            
            // เปลี่ยนจากแสดงกราฟิก CSS เป็นแสดงวิดีโอที่เตรียมไว้
            modalVisualSim.innerHTML = data.videoHtml; 
            
            // ส่วนปุ่มควบคุมถ้าไม่ใช้ก็สามารถสั่งซ่อนได้
            modalSimControls.style.display = 'none'; 
        
            modal.style.display = 'flex';
        }

    </script>
</body>
</html>
