<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โซลูชันบ้านอัจฉริยะ - Real Smart Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent: #00d2ff;
            --text: #ffffff;
            --text-dim: #888;
            --overlay: rgba(0, 0, 0, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Prompt', sans-serif; background: var(--bg-dark); color: var(--text); overflow-x: hidden; }

        /* Navigation */
        nav { padding: 20px; text-align: center; border-bottom: 1px solid #222; background: rgba(15,15,15,0.9); position: sticky; top: 0; z-index: 1000; }
        nav a { color: #fff; text-decoration: none; margin: 0 15px; font-weight: 500; transition: 0.3s; }
        nav a:hover, nav a.active { color: var(--accent); }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; position: relative; }
        .header-section { text-align: center; margin-bottom: 50px; }
        .header-section h1 { font-size: 2.5rem; color: var(--accent); margin-bottom: 10px; }

        /* Day/Night Toggles */
        .controls { display: flex; gap: 15px; margin-bottom: 20px; justify-content: center; }
        .toggle-btn {
            background: #222; border: 1px solid #444; color: #fff; padding: 10px 20px;
            border-radius: 50px; cursor: pointer; transition: 0.3s; font-family: 'Prompt'; display: flex; align-items: center; gap: 8px;
        }
        .toggle-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }

        /* Interactive Blueprint */
        .showcase-wrapper {
            position: relative;
            background: #151515;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #222;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .house-blueprint {
            position: relative;
            width: 100%;
            height: auto;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #333;
        }
        .house-blueprint img { width: 100%; height: auto; display: block; transition: filter 0.5s; }

        /* Night Mode Effect */
        .night-mode .house-blueprint img { filter: brightness(0.3) contrast(1.1); }

        /* Hotspots */
        .hotspot {
            position: absolute;
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            animation: pulse 2s infinite;
            z-index: 10;
            color: var(--accent);
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0px rgba(0, 210, 255, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(0, 210, 255, 0); }
            100% { box-shadow: 0 0 0 0px rgba(0, 210, 255, 0); }
        }

        /* Modal (Popup) */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9);
            display: none; align-items: center; justify-content: center; padding: 20px;
            z-index: 2000; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: var(--card-bg); width: 100%; max-width: 700px;
            border-radius: 15px; overflow: hidden; border: 1px solid #333;
            position: relative; animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-header { padding: 20px; border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: space-between; }
        .modal-title { font-size: 1.2rem; font-weight: 600; color: var(--accent); }
        .close-modal { font-size: 1.5rem; color: #888; cursor: pointer; }

        .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .modal-visual-sim { width: 100%; border-radius: 10px; overflow: hidden; background: #000; }
        .modal-desc { color: var(--text-dim); line-height: 1.6; font-size: 0.95rem; text-align: center; }
    </style>
</head>
<body class="day-mode">

    <nav>
        <a href="index.html">หน้าหลัก</a>
        <a href="catalog.html">แคตตาล็อก</a>
        <a href="oursolution.html" class="active">โซลูชันของเรา</a>
        <a href="quotation.html">ประเมินราคา</a>
    </nav>

    <div class="container">
        <div class="header-section">
            <h1>Interactive Smart House Blueprint</h1>
            <p>คลิกที่จุด Hotspots บนแบบบ้าน เพื่อชมวิดีโอการทำงานของระบบอัจฉริยะ</p>
        </div>

        <div class="showcase-wrapper">
            <div class="house-blueprint">
                <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1200" alt="แบบบ้านอัจฉริยะ">

                <div class="hotspot" style="top: 24%; left: 47%;" onclick="openModal(1)"><i class="fa-solid fa-scroll"></i></div>
                <div class="hotspot" style="top: 63%; left: 25%;" onclick="openModal(2)"><i class="fa-solid fa-lightbulb"></i></div>
                <div class="hotspot" style="top: 82%; left: 10%;" onclick="openModal(3)"><i class="fa-solid fa-faucet-drip"></i></div>
                <div class="hotspot" style="top: 87%; left: 65%;" onclick="openModal(4)"><i class="fa-solid fa-gate"></i></div>
                <div class="hotspot" style="top: 60%; left: 78%;" onclick="openModal(5)"><i class="fa-solid fa-shield-halved"></i></div>
                <div class="hotspot" style="top: 44%; left: 76%;" onclick="openModal(6)"><i class="fa-solid fa-video"></i></div>
            </div>

             <div class="controls">
                <button class="toggle-btn active" id="dayBtn" onclick="setMode('day')"><i class="fa-solid fa-sun"></i> Day Mode</button>
                <button class="toggle-btn" id="nightBtn" onclick="setMode('night')"><i class="fa-solid fa-moon"></i> Night Mode</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="solutionModal" onclick="closeModal(event)">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">ชื่อระบบ</div>
                <span class="close-modal" onclick="closeModalBtn()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="modal-visual-sim" id="modalVisualSim"></div>
                <p class="modal-desc" id="modalDesc">รายละเอียดการทำงาน...</p>
            </div>
        </div>
    </div>

    <script>
        const solutionsData = {
            1: { 
                title: "ระบบม่านไฟฟ้าเลื่อนปิดตรงกลาง", 
                desc: "วิดีโอสาธิตการทำงานจริงของม่านอัจฉริยะ สะดวกสบาย สั่งงานผ่านมือถือหรือเสียง",
                videoHtml: createYoutubeEmbed("anGjhqLkP_s")
            },
            2: { 
                title: "ไฟ RGB ห้องนั่งเล่น (Ambient Light)", 
                desc: "ปรับเปลี่ยนบรรยากาศห้องนั่งเล่นให้เหมาะกับการดูหนัง หรือพักผ่อนด้วยไฟ RGB อัจฉริยะ",
                videoHtml: createYoutubeEmbed("RFXhmR08K4c")
            },
            3: { 
                title: "ระบบรดน้ำอัตโนมัติอัจฉริยะ", 
                desc: "รดน้ำต้นไม้ตามค่าความชื้นในดินจริง ประหยัดน้ำและดูแลสวนให้เขียวขจีตลอดเวลา",
                videoHtml: createYoutubeEmbed("bPJ02j2VHoc")
            },
            4: { 
                title: "ประตูรั้วบานเลื่อนไฟฟ้า", 
                desc: "เพิ่มความสะดวกและปลอดภัย สั่งเปิดประตูรั้วได้ตั้งแต่ยังไม่ถึงบ้าน พร้อมดูผ่านกล้องได้ทันที",
                videoHtml: createYoutubeEmbed("P_IfMnEP4Gc")
            },
            5: { 
                title: "ระบบไฟและเซ็นเซอร์อัตโนมัติ", 
                desc: "ไฟติดเองเมื่อเดินผ่าน และระบบรักษาความปลอดภัยที่แจ้งเตือนทันทีเมื่อมีการบุกรุก",
                videoHtml: createYoutubeEmbed("j_WITlt8IE4")
            },
            6: { 
                title: "กล้องวงจรปิดอัจฉริยะ", 
                desc: "กล้องที่มาพร้อม AI ตรวจจับคนแปลกหน้า และสามารถเชื่อมต่อสั่งงานอุปกรณ์อื่นในบ้านได้",
                videoHtml: createYoutubeEmbed("YHGXs2Bl2qI")
            }
        };

        // Helper ฟังก์ชันสำหรับสร้าง Embed Code ที่ถูกต้อง
        function createYoutubeEmbed(videoId) {
            return `
                <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;">
                    <iframe 
                        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"
                        src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&loop=1&playlist=${videoId}&controls=1" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                </div>`;
        }

        const modal = document.getElementById('solutionModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalVisualSim = document.getElementById('modalVisualSim');
        const modalDesc = document.getElementById('modalDesc');

        function openModal(id) {
            const data = solutionsData[id];
            if (!data) return;
            modalTitle.innerText = data.title;
            modalDesc.innerText = data.desc;
            modalVisualSim.innerHTML = data.videoHtml;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal(e) { if (e.target.id === 'solutionModal') closeModalBtn(); }
        function closeModalBtn() {
            modal.style.display = 'none';
            modalVisualSim.innerHTML = ""; // หยุดวิดีโอเมื่อปิด popup
            document.body.style.overflow = 'auto';
        }

        function setMode(mode) {
            const body = document.body;
            if(mode === 'night') {
                body.classList.add('night-mode');
                document.getElementById('nightBtn').classList.add('active');
                document.getElementById('dayBtn').classList.remove('active');
            } else {
                body.classList.remove('night-mode');
                document.getElementById('dayBtn').classList.add('active');
                document.getElementById('nightBtn').classList.remove('active');
            }
        }

        // Helper ฟังก์ชันสำหรับสร้าง Embed Code ที่คลีนที่สุด
        function createYoutubeEmbed(videoId) {
            return `
                <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; background: #000;">
                    <iframe 
                        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; "
                        src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&loop=1&playlist=${videoId}&controls=0&modestbranding=1&rel=0&iv_load_policy=3&disablekb=1" 
                        frameborder="0" 
                        allow="autoplay; encrypted-media" 
                        allowfullscreen>
                    </iframe>
                </div>`;
        }
    </script>
</body>
</html>
